[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-motion-research"
version = "0.21.0"
description = "Physics-conditioned humanoid policies and audited sequence PPO research scaffold"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.10,<2.11", "packaging>=23", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "safetensors>=0.6", "tensordict>=0.11,<0.13", "loguru>=0.7"]
sim = ["mjlab==1.6.0", "mujoco~=3.11.0", "mujoco-warp~=3.11.0", "warp-lang>=1.14.0"]
holomotion = [
  "accelerate>=1.0",
  "einops>=0.8",
  "h5py>=3.16",
  "hydra-core==1.3.2",
  "loguru>=0.7",
  "omegaconf==2.3.0",
  "pytorch-kinematics>=0.10",
  "safetensors>=0.6",
  "tabulate>=0.9",
  "tensordict>=0.11,<0.13",
]

[project.scripts]
unified-motion-experiment = "unified_motion.experiment:main"
unified-motion-train = "unified_motion.train:main"
unified-motion-verify-physics = "unified_motion.envs.physics_validation:main"

[tool.setuptools.packages.find]
include = ["unified_motion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
