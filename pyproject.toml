[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pera-g1"
version = "0.1.0"
description = "Frozen HoloMotion G1 policies with independently trained task FFNs"
readme = "README.md"
authors = [
  {name = "Shangchao Hu"},
  {name = "Yadan Sun"},
]
license = {file = "LICENSE"}
requires-python = ">=3.11,<3.13"
dependencies = ["torch>=2.9,<2.10", "numpy>=1.26,<3", "mujoco>=3.5,<3.12", "omegaconf==2.3.0", "hydra-core==1.3.2", "h5py>=3.14,<4", "tensordict>=0.11,<0.15", "safetensors>=0.6,<0.7"]

[project.urls]
Repository = "https://github.com/shangchaohu718/PERA"
Issues = "https://github.com/shangchaohu718/PERA/issues"

[project.optional-dependencies]
native = ["mujoco==3.11.0", "mujoco-warp==3.11.0", "warp-lang==1.14.0", "imageio>=2.37", "imageio-ffmpeg==0.6.0", "Pillow>=11", "matplotlib>=3.9", "requests>=2.31"]
dev = ["pytest>=8", "ruff==0.16.6"]

[project.scripts]
pera = "pera.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pera*", "blinkmimic*", "modumotion_g1*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
