schema: 1
branches: [base, plus, minus]
null_replicate_branch: base_duplicate
context_steps: 32
deltas_rad: [0.005, 0.01, 0.02, 0.04]
joints:
  - left_ankle_pitch_joint
  - left_ankle_roll_joint
  - right_ankle_pitch_joint
  - right_ankle_roll_joint
probe_frames:
  left_slide_right_anchor: [5, 10, 50, 55]
  left_to_air_transition: [11, 12, 61, 62]
  air_to_right_slide_transition: [22, 23, 72, 73]
  right_slide_left_anchor: [25, 30, 75, 80]
  right_to_air_transition: [36, 37, 86, 87]
friction_conditions:
  - {name: low, static: 0.4, dynamic: 0.3}
  - {name: nominal, static: 0.6, dynamic: 0.5}
  - {name: high, static: 0.8, dynamic: 0.7}
metrics:
  tangent_truth_floor_m_s: 0.005
  force_truth_floor_n: 5.0
  action_ignored_ratio: 0.1
protocol:
  one_step_only: true
  same_state_branching_required: true
  pre_branch_state_max_abs_error_limit: 1.0e-6
  null_replicate_required: true
  physical_response_noise_multiplier: 3.0
  processed_target_delta_must_be_recorded: true
  delayed_actuator_target_delta_must_be_recorded: true
  applied_torque_delta_must_be_recorded: true
  collection_quality_and_probe_informativeness_are_separate: true
  null_tangent_noise_max_m_s: 0.001
  null_force_noise_max_n: 0.1
  perturbation_dataset_is_evaluation_only: true
  actor_updates: 0
  ppo_updates: 0
