<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390" fill="none">
<title>PERA frozen public Actor with explicitly activated FFN and router experts</title>
<desc>Simplified implemented anchor route. The frozen shared Actor's MoE FFN combines its public group with an enabled plug-in group. Existing attention, normalizers and output head remain frozen. Task experts extend the shared frozen policy.</desc>
