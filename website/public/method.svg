<text x="601" y="192" text-anchor="middle" font-size="12" fill="#0071e3">Explicit skill switch</text>
<text x="560" y="369" text-anchor="middle" font-size="12" fill="#6e6e73">Simplified anchor-mode inference graph · Visual context enters perceptive plug-ins only · Disabled plug-ins are bypassed</text>
