<rect x="511" y="216" width="180" height="65" rx="8" stroke="#0071e3" fill="#eaf3ff"/><text x="601" y="244" text-anchor="middle" fill="#0071e3">Plug-in FFN + router</text><text x="601" y="264" text-anchor="middle" font-size="12" fill="#0071e3">Only enabled experts participate</text>
